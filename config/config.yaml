# UI 自动化测试配置文件

# 浏览器配置
browser:
  name: chromium  # chromium, firefox, webkit
  headless: true  # 无头模式（不显示浏览器窗口）
  slow_mo: 0  # 操作延迟 (毫秒)
  timeout: 30000  # 默认超时 (毫秒)
  viewport:
    width: 1920
    height: 1080
  args:
    - --start-maximized
    - --disable-notifications

# 测试配置
test:
  base_url: http://172.16.34.104:7777/dataapp
  timeout: 30000
  retry: 2
  
# 证据收集配置（用于审计）
evidence:
  # 视频录制：always(始终) / on_failure(失败时) / never(不录制)
  video: always
  # 截图：always / on_failure / never
  screenshot: always
  # 保存页面 HTML: true / false
  page_html: always
  # 录制 Playwright Trace: true / false (最详细，包含所有 DOM 快照、网络请求等)
  trace: always
  
# 日志配置
log:
  level: DEBUG  # DEBUG, INFO, WARNING, ERROR
  file: logs/test.log
  console: true
  # 记录网络请求：true / false
  network_log: false
  # 记录浏览器控制台：true / false
  console_log: true

# 认证配置
auth:
  login_url: /login
  default_username: T100002
  default_password: wisedu@1
  default_verify_code: 2222
  default_group: 信息中心管理员

# 页面路径
pages:
  my_data: /index#/jssjzx/grsjzx/myarchive/myarchive
  data_query: /index#/jssjzx/grsjzx/jssjcx
  teacher_manage: /index#/jssjzx/grsjzx/jslbgl
  data_compare: /index#/jssjzx/grsjzx/sjbd
  model_config: /index#/jssjzx/grsjzx/grsjzx_yysz/dataModelManage
  model_permission: /index#/jssjzx/grsjzx/grsjzx_yysz/sjqxgl

# 报告配置
report:
  format: html  # html, allure, junit
  output_dir: reports
  open_report: true

# 日志配置
log:
  level: INFO  # DEBUG, INFO, WARNING, ERROR
  file: logs/test.log
  console: true

# 测试数据
data:
  environment: test  # dev, test, staging, prod
  locale: zh_CN
