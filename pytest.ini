[pytest]
# ============ 测试发现 ============
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# ============ 测试标记 ============
markers =
    smoke: 冒烟测试 (快速验证)
    regression: 回归测试 (完整验证)
    slow: 慢速测试 (>30s)
    api: API 测试
    ui: UI 测试
    p1: P1 优先级测试
    p2: P2 优先级测试

# ============ 默认命令行选项 ============
# -v: 详细输出
# --tb=short: 简短回溯
# --strict-markers: 严格标记检查
# --maxfail=3: 连续失败 3 次后停止 (CI 友好)
addopts = 
    -v
    --tb=short
    --strict-markers
    --maxfail=3
    --html=reports/report.html
    --self-contained-html
    --junit-xml=reports/test-results.xml

# ============ 日志配置 ============
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# ============ 日志文件 ============
log_file = logs/test.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)s] [%(name)s] %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# ============ 超时配置 ============
timeout = 300

# ============ CI/CD 环境变量 ============
# 设置 CI=true 启用 CI 模式
# 设置 PARALLEL_WORKERS=4 指定并行数
